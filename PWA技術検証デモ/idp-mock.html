<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旬報店システム ログイン（検証用モック）</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  /* 別システムであることが分かるよう、あえて別デザイン（緑系） */
  body{ font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; color:#1b2a22;
    background:linear-gradient(160deg,#1f8a5c,#0f5a3c); line-height:1.6;
    display:flex; align-items:center; justify-content:center; min-height:100%;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px); }
  .box{ background:#fff; width:100%; max-width:380px; border-radius:16px; padding:22px 20px; box-shadow:0 12px 40px rgba(0,0,0,.25); }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .brand .logo{ width:34px; height:34px; border-radius:8px; background:#0f5a3c; color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:15px; }
  .brand h1{ font-size:16px; margin:0; color:#0f5a3c; }
  .sub{ font-size:12px; color:#6b7280; margin:0 0 14px; }
  label{ font-size:12px; color:#374151; font-weight:700; display:block; margin:10px 0 4px; }
  input{ font:inherit; width:100%; padding:11px 12px; border:1px solid #cdd6d1; border-radius:10px; }
  button{ font:inherit; font-weight:800; border:0; border-radius:10px; padding:13px 16px; width:100%; margin-top:16px; color:#fff; background:#0f5a3c; cursor:pointer; }
  button.ghost{ background:#fff; color:#0f5a3c; border:1.5px solid #0f5a3c; margin-top:10px; }
  .meta{ margin-top:14px; font-size:11.5px; color:#6b7280; border-top:1px dashed #d8dee8; padding-top:10px; }
  .meta b{ color:#374151; }
  .tag{ display:inline-block; background:#E9F7EC; color:#1b5e20; border:1px solid #9ad3a3; border-radius:6px; padding:1px 7px; font-size:11px; font-weight:700; }
  .warn{ background:#FFF8E1; border:1px solid #F3D27A; color:#6b5900; border-radius:10px; padding:9px 11px; font-size:11.5px; margin-top:12px; }
</style>
</head>
<body>
<div class="box">
  <div class="brand"><div class="logo">旬</div><h1>旬報店システム ログイン</h1></div>
  <p class="sub">新カウンセリングシステムからの認証リクエスト（検証用モック）</p>

  <label>ログインID</label>
  <input id="uid" type="text" inputmode="email" autocomplete="username" placeholder="salon-login-id">
  <label>パスワード</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">

  <button id="login">ログイン（アプリに戻る）</button>
  <button id="cancel" class="ghost">キャンセル</button>

  <div class="warn" id="promptNote" hidden>この画面は <b>prompt=login</b> 指定です。共用端末では毎回パスワード入力を求め、前の人のログイン状態を残さない運用を想定しています。</div>

  <div class="meta" id="meta"></div>
</div>

<script>
(function(){
  "use strict";
  var p=new URLSearchParams(location.search);
  var redirect=p.get("redirect_uri")||"";
  var state=p.get("state")||"";
  var challenge=p.get("code_challenge")||"";
  var prompt=p.get("prompt")||"";
  function dm(){ if(navigator.standalone===true) return "standalone"; var ms=["fullscreen","standalone","minimal-ui"]; for(var i=0;i<ms.length;i++){try{if(matchMedia("(display-mode: "+ms[i]+")").matches)return ms[i];}catch(e){}} return "browser"; }

  document.getElementById("promptNote").hidden = (prompt!=="login");
  document.getElementById("meta").innerHTML =
    '<span class="tag">このIdP画面の表示＝'+dm()+'</span><br>'
    +'<b>redirect_uri</b>：'+ (redirect? redirect.replace(/^https?:\/\//,'') : '(なし)') +'<br>'
    +'<b>state</b>：'+(state?state.slice(0,10)+'…':'(なし)')+' / <b>PKCE</b>：'+(challenge?'あり(S256)':'なし');

  function back(extra){
    if(!redirect){ alert("redirect_uri がありません（検証用モック）。auth-test.html から開いてください。"); return; }
    var sep = redirect.indexOf("?")>=0 ? "&" : "?";
    location.href = redirect + sep + extra;
  }
  document.getElementById("login").onclick=function(){
    // 実際はここでID/パスワードを旬報店が照合。モックは入力内容を問わず認可コードを返す。
    var code = "mock-"+Math.random().toString(36).slice(2,12);
    back("code="+encodeURIComponent(code)+"&state="+encodeURIComponent(state));
  };
  document.getElementById("cancel").onclick=function(){
    back("error=access_denied&state="+encodeURIComponent(state));
  };
})();
</script>
</body>
</html>
